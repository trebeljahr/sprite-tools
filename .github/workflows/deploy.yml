# Candidate builds never move a live tag. Deployment requires explicit activation.
# SPRITE_TOOLS_ROLLOUT_MODE: unset/off, manual, or automatic.
# The contract is scripts/ROLLING_RELEASE.md.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Build, deploy a reviewed image, or verify a release
        type: choice
        options: [build, deploy, verify]
        default: build
      target_sha:
        description: Full commit SHA required for deploy or verify
        type: string
        required: false
      image_digest:
        description: Exact sha256 image digest from the build artifact (deploy only)
        type: string
        required: false
      expected_current_digest:
        description: Reviewed current latest digest (deploy only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: image-release-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    if: github.repository == 'trebeljahr/sprite-tools' && github.ref == 'refs/heads/main' && inputs.operation != 'verify' && inputs.operation != 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Release and drain contract tests
        run: node --test scripts/release.test.mjs scripts/rolling-release.test.mjs scripts/shared-asset-releases.test.mjs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trebeljahr/sprite-tools
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}

      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # Next's skew protection id, see the Dockerfile.
          build-args: |
            DEPLOYMENT_ID=${{ github.sha }}
          # BuildKit secret for decrypting .env.production at build
          # time. Mounted as tmpfs inside the Dockerfile's RUN step,
          # never written to a layer or `docker history`. The Dockerfile
          # exposes it as the DOTENV_PRIVATE_KEY_PRODUCTION env var for
          # `dotenvx run -- pnpm build`, which decrypts in memory and
          # bakes NEXT_PUBLIC_* / VITE_* values into the bundle.
          secrets: |
            dotenvx_private_key=${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}

      - name: Record immutable release identity
        env:
          IMAGE: ghcr.io/trebeljahr/sprite-tools
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const { GITHUB_SHA: commit, IMAGE: image, IMAGE_DIGEST: digest } = process.env;
          if (!/^[a-f0-9]{40}$/.test(commit) || !/^sha256:[a-f0-9]{64}$/.test(digest)) {
            throw new Error('Build did not provide a full commit and image digest.');
          }
          writeFileSync('release.json', JSON.stringify({ commit, image, digest, reference: `${image}@${digest}` }, null, 2) + '\n');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error

  # This only observes public HTTP responses. It never queues a deployment
  # or changes a registry tag.
  verify:
    if: github.repository == 'trebeljahr/sprite-tools' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify the serving commit
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: node scripts/verify-release.mjs "$EXPECTED_SHA"

  deploy:
    needs: build
    if: >-
      always() && !cancelled() &&
      github.repository == 'trebeljahr/sprite-tools' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.SPRITE_TOOLS_ROLLOUT_MODE == 'automatic' && needs.build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Promote, queue this app, and verify the release
        env:
          ROLLOUT_MODE: ${{ vars.SPRITE_TOOLS_ROLLOUT_MODE }}
          TARGET_SHA: ${{ github.event_name == 'push' && github.sha || inputs.target_sha }}
          TARGET_DIGEST: ${{ github.event_name == 'push' && needs.build.outputs.digest || inputs.image_digest }}
          EXPECTED_CURRENT_DIGEST: ${{ inputs.expected_current_digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_DEPLOY_SECRET: ${{ secrets.COOLIFY_DEPLOY_SECRET }}
          COOLIFY_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_DEPLOY_REPOSITORY }}
          COOLIFY_DEPLOY_BRANCH: ${{ secrets.COOLIFY_DEPLOY_BRANCH }}
        run: node scripts/rolling-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollout.json
          if-no-files-found: warn
