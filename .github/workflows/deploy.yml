# Candidate builds never move a live tag. Deployment requires explicit activation.
# SPRITE_TOOLS_ROLLOUT_MODE: unset/off, manual, or automatic.
# The contract is scripts/ROLLING_RELEASE.md.
#
# Two halves ship from one commit: the accounts server image (Coolify, /api)
# and the static client (Cloudflare Worker `sprite-tools-client`, every other
# path). Builds upload both without making either live. The deploy job then
# releases the server first, and activates the client version only after the
# server serves this commit.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Build, deploy a reviewed image, or verify a release
        type: choice
        options: [build, deploy, verify]
        default: build
      target_sha:
        description: Full commit SHA required for deploy or verify
        type: string
        required: false
      image_digest:
        description: Exact sha256 image digest from the build artifact (deploy only)
        type: string
        required: false
      expected_current_digest:
        description: Reviewed current latest digest (deploy only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: image-release-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  WRANGLER_VERSION: "4.148.0"
  SITE: https://sprites.trebeljahr.com

jobs:
  build:
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    if: github.repository == 'trebeljahr/sprite-tools' && github.ref == 'refs/heads/main' && inputs.operation != 'verify' && inputs.operation != 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Release contract tests
        run: node --test scripts/release.test.mjs scripts/rolling-release.test.mjs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trebeljahr/sprite-tools
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}

      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: Record immutable release identity
        env:
          IMAGE: ghcr.io/trebeljahr/sprite-tools
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const { GITHUB_SHA: commit, IMAGE: image, IMAGE_DIGEST: digest } = process.env;
          if (!/^[a-f0-9]{40}$/.test(commit) || !/^sha256:[a-f0-9]{64}$/.test(digest)) {
            throw new Error('Build did not provide a full commit and image digest.');
          }
          writeFileSync('release.json', JSON.stringify({ commit, image, digest, reference: `${image}@${digest}` }, null, 2) + '\n');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error

  # Builds the static export and uploads it as a Worker version tagged with
  # the commit. Uploading does not change what the site serves.
  client:
    if: github.repository == 'trebeljahr/sprite-tools' && github.ref == 'refs/heads/main' && inputs.operation != 'verify' && inputs.operation != 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the static client
        env:
          NEXT_DEPLOYMENT_ID: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          node scripts/write-version.mjs public
          pnpm exec dotenvx run --quiet -f .env.production -- pnpm build

      # Open tabs keep asking for their own hashed chunks, and a Worker
      # version serves only the files it was uploaded with. Carry the files of
      # the releases the live site still lists, then tell tabs which releases
      # remain (ReleaseNotice reads /releases.json).
      - name: Carry earlier releases' browser files
        run: |
          node scripts/carry-static.mjs --site "$SITE" --out out --release "$GITHUB_SHA"
          node scripts/write-releases.mjs out

      - name: Upload the client version (not activated)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" versions upload --tag "$GITHUB_SHA" --message "$GITHUB_SHA"

  # This only observes public HTTP responses. It never queues a deployment,
  # changes a registry tag or activates a Worker version.
  verify:
    if: github.repository == 'trebeljahr/sprite-tools' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify the serving commit
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: node scripts/verify-release.mjs "$EXPECTED_SHA"

  deploy:
    needs: [build, client]
    if: >-
      always() && !cancelled() &&
      github.repository == 'trebeljahr/sprite-tools' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.SPRITE_TOOLS_ROLLOUT_MODE == 'automatic' && needs.build.result == 'success' && needs.client.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      TARGET_SHA: ${{ github.event_name == 'push' && github.sha || inputs.target_sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Promote, queue the server app, and verify it
        env:
          ROLLOUT_MODE: ${{ vars.SPRITE_TOOLS_ROLLOUT_MODE }}
          TARGET_DIGEST: ${{ github.event_name == 'push' && needs.build.outputs.digest || inputs.image_digest }}
          EXPECTED_CURRENT_DIGEST: ${{ inputs.expected_current_digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_DEPLOY_SECRET: ${{ secrets.COOLIFY_DEPLOY_SECRET }}
          COOLIFY_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_DEPLOY_REPOSITORY }}
          COOLIFY_DEPLOY_BRANCH: ${{ secrets.COOLIFY_DEPLOY_BRANCH }}
        run: node scripts/rolling-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollout.json
          if-no-files-found: warn
      # The server serves this commit now; a failure below leaves a new server
      # with the previous client, which is the compatible direction.
      - name: Activate the client version uploaded for this commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" versions list --json > versions.json
          version=$(node scripts/client-version.mjs "$TARGET_SHA" versions.json)
          npx --yes "wrangler@$WRANGLER_VERSION" versions deploy "$version@100%" --yes --message "$TARGET_SHA"
      - name: Verify the client
        run: node scripts/verify-release.mjs "$TARGET_SHA" client
