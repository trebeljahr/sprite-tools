# Build SHA-tagged images without changing the image currently served by Coolify.
# The signed hook cannot choose an image tag. Deployment stays with the
# operator until an authorized capability can pin and verify the exact digest.
name: Build & Verify Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Build an image, or verify an already deployed release
        type: choice
        options: [build, verify]
        default: build
      target_sha:
        description: Full commit SHA to verify (required for verify)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    if: github.repository == 'trebeljahr/sprite-tools' && github.ref == 'refs/heads/main' && inputs.operation != 'verify'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Release and drain contract tests
        run: node --test scripts/release.test.mjs scripts/shared-asset-releases.test.mjs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/trebeljahr/sprite-tools
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}

      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # Next's skew protection id, see the Dockerfile.
          build-args: |
            DEPLOYMENT_ID=${{ github.sha }}
          # BuildKit secret for decrypting .env.production at build
          # time. Mounted as tmpfs inside the Dockerfile's RUN step,
          # never written to a layer or `docker history`. The Dockerfile
          # exposes it as the DOTENV_PRIVATE_KEY_PRODUCTION env var for
          # `dotenvx run -- pnpm build`, which decrypts in memory and
          # bakes NEXT_PUBLIC_* / VITE_* values into the bundle.
          secrets: |
            dotenvx_private_key=${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}

      - name: Record immutable release identity
        env:
          IMAGE: ghcr.io/trebeljahr/sprite-tools
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const { GITHUB_SHA: commit, IMAGE: image, IMAGE_DIGEST: digest } = process.env;
          if (!/^[a-f0-9]{40}$/.test(commit) || !/^sha256:[a-f0-9]{64}$/.test(digest)) {
            throw new Error('Build did not provide a full commit and image digest.');
          }
          writeFileSync('release.json', JSON.stringify({ commit, image, digest, reference: `${image}@${digest}` }, null, 2) + '\n');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error

  # This only observes public HTTP responses. It never queues a deployment,
  # changes a registry tag, or treats a webhook commit as proof of image identity.
  verify:
    if: github.repository == 'trebeljahr/sprite-tools' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify the serving commit
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: node scripts/verify-release.mjs "$EXPECTED_SHA"
