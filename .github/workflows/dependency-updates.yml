name: dependency-updates

# Lands Dependabot's grouped minor/patch and security PRs (see
# .github/dependabot.yml): runs the same checks as the push pipeline on the PR,
# squash-merges it, and starts deploy.yml's build on main, which releases it
# like a push when SPRITE_TOOLS_ROLLOUT_MODE is automatic. A merge made with
# GITHUB_TOKEN does not trigger push workflows, so the deploy is started
# explicitly. One PR per run; the next run takes the next one after Dependabot
# rebases it.
#
# Never lands: a major update, an ungrouped PR, a PR with a commit that is not
# Dependabot's, or a PR whose checks fail. Those stay open for a person.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: dependency-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pick.outputs.number }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Pick the oldest grouped Dependabot PR
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pr=$(gh pr list --repo "$REPO" --state open --author app/dependabot --base main \
                 --json number,headRefName,headRefOid,createdAt \
                 --jq '[.[] | select(.headRefName | test("^dependabot/npm_and_yarn/npm-(minor-patch|security)-"))] | sort_by(.createdAt) | first // empty')
          if [ -z "$pr" ]; then echo "no grouped Dependabot PR is open"; exit 0; fi
          number=$(jq -r .number <<<"$pr"); sha=$(jq -r .headRefOid <<<"$pr")
          others=$(gh pr view "$number" --repo "$REPO" --json commits \
                     --jq '[.commits[].authors[].login | select(. != "dependabot[bot]")] | length')
          if [ "$others" != "0" ]; then
            echo "::warning::PR #$number has commits that are not Dependabot's: left for a person"; exit 0
          fi
          echo "PR #$number at $sha"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # The same gates as ci.yml, which runs on every push to main, plus the
  # release contract tests from deploy.yml's build job. They run the PR's
  # code with a read-only token and no secrets.
  checks:
    needs: [pick]
    if: needs.pick.outputs.number != ''
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: matrix.task == 'test'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}

  build:
    needs: [pick]
    if: needs.pick.outputs.number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://sprites.trebeljahr.com
      - name: Workers static asset limits
        run: |
          files=$(find out -type f | wc -l)
          echo "out/: $files files"
          test "$files" -le 6000
          large=$(find out -type f -size +25M)
          test -z "$large" || { echo "Over 25 MiB: $large"; exit 1; }
      - run: pnpm build:server
      - name: Release contract tests
        run: node --test scripts/release.test.mjs scripts/rolling-release.test.mjs

  land:
    needs: [pick, checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Squash-merge the tested commit and deploy main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.pick.outputs.number }}
          SHA: ${{ needs.pick.outputs.sha }}
        run: |
          # --match-head-commit refuses if Dependabot pushed again after the tests.
          gh pr merge "$NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$SHA"
          gh workflow run deploy.yml --repo "$REPO" --ref main -f operation=build
          echo "merged #$NUMBER and started deploy.yml (build) on main"
