name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks fan out in parallel — fail one, fail the job, but each
  # surfaces its own log so all the breakage is visible at once.
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}

  # Build runs separately because it's the slow one and we want logs
  # next to the rest of the gate, not buried inside it.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Defaults so build never trips on missing dotenvx files (the
          # deploy workflow decrypts the real .env.production).
          NEXT_PUBLIC_SITE_URL: https://sprites.trebeljahr.com
      # The static export is uploaded to a Cloudflare Worker: Workers Free
      # allows 20,000 files per version (carried releases count too) and
      # 25 MiB per file.
      - name: Workers static asset limits
        run: |
          files=$(find out -type f | wc -l)
          echo "out/: $files files"
          test "$files" -le 6000
          large=$(find out -type f -size +25M)
          test -z "$large" || { echo "Over 25 MiB: $large"; exit 1; }
      - run: pnpm build:server
