name: Documentation issue
description: Report missing, confusing, or stale docs.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: README, /docs/cli, collision command help
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should change?
      description: Tell us what is missing, wrong, or confusing.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      description: Optional. Draft wording is welcome.

