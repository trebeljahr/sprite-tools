name: Bug report
description: Report something broken or surprising.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please include enough detail to reproduce the issue.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `sprite-tools ...`
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Web app
        - CLI
        - MCP server
        - Shared algorithm
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sprite-tools version
      placeholder: "0.1.0"
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "v24.0.0"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15, Ubuntu 24.04, Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell

