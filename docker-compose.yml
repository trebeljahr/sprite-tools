# Coolify reads this file (build pack: dockercompose) to deploy
# sprite-tools. The image is built by .github/workflows/deploy.yml and
# pushed to GHCR; Coolify pulls it and (re)starts the service when
# the workflow's deploy webhook fires.
#
# Runtime: node + `next start` (see Dockerfile). Not nginx — the app
# has Server Actions and a route handler that need a Node runtime.
#
# To pin a specific version, change the tag below from `latest` to a
# git sha, semver tag, or whatever your release process uses.
services:
  app:
    image: ghcr.io/trebeljahr/sprite-tools:latest
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      # Forwarded from Coolify's app env. dotenvx inside the container
      # uses this to decrypt the committed .env.production at startup
      # so server-side secrets (XAI_API_KEY, etc.) reach Server Actions.
      - DOTENV_PRIVATE_KEY_PRODUCTION
    # Coolify gates Traefik/Caddy routing on this. Without a healthcheck
    # traffic can hit the container before next start finishes booting.
    # node-based check (not wget/curl) — the runtime image is node:slim
    # and doesn't ship either of those.
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:80/',r=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
