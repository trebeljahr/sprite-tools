# Coolify reads this file (build pack: dockercompose) to deploy
# sprite-tools. The image is built by .github/workflows/deploy.yml and
# pushed to GHCR; Coolify pulls it (see `pull_policy` below) and
# (re)starts the service when the workflow's deploy webhook fires.
#
# Runtime: node + `next start` (see Dockerfile). Not nginx — the app
# has Server Actions and a route handler that need a Node runtime.
#
# To pin a specific version, change the tag below from `latest` to a
# git sha, semver tag, or whatever your release process uses.
services:
  app:
    image: ghcr.io/trebeljahr/sprite-tools:latest
    # Force a registry pull on every `docker compose up`. Without this,
    # Compose reuses whichever digest the Coolify host cached the last
    # time it saw `:latest`, so the deploy webhook restarts the container
    # on the PREVIOUS build while Coolify reports the deploy as finished.
    # That kept the 9a2b22d (May 2026) build live through the 2026-09-28
    # redeploy.
    pull_policy: always
    restart: unless-stopped
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Coolify's Traefik reverse-proxy already owns host ports 80/443 and
    # routes to this container via its internal Docker network. Use
    # `expose` (not `ports`) so we declare the container port without
    # trying to bind it on the host — binding the host port collides with
    # Traefik and the deploy fails with
    # "Bind for 0.0.0.0:80 failed: port is already allocated".
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
      # Forwarded from Coolify's app env. dotenvx inside the container
      # uses this to decrypt the committed .env.production at startup
      # so server-side secrets (XAI_API_KEY, etc.) reach Server Actions.
      - DOTENV_PRIVATE_KEY_PRODUCTION
      - POSTGRES_URL
      - BETTER_AUTH_SECRET
      - BETTER_AUTH_URL
      - LISTMONK_URL
      - LISTMONK_API_USER
      - LISTMONK_API_TOKEN
      - LISTMONK_TX_TEMPLATE_ID
      - LISTMONK_FROM_EMAIL
    # Coolify gates Traefik/Caddy routing on this. Without a healthcheck
    # traffic can hit the container before next start finishes booting.
    # node-based check (not wget/curl) — the runtime image is node:slim
    # and doesn't ship either of those.
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:8080/',r=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
